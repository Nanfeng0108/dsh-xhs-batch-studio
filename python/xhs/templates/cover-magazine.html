<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{--font:{{FONT_STACK}};--bg:{{BG}};--ink:{{INK}};--muted:{{MUTED}};--accent:{{ACCENT}};--accent-soft:{{ACCENT_SOFT}};--line:{{LINE}};--on-accent:{{ON_ACCENT}};--surface:{{SURFACE}}}
  *{margin:0;padding:0;box-sizing:border-box}
  html{font-size:16px}
  body{width:{{WIDTH}}px;height:{{HEIGHT}}px;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:var(--font);-webkit-font-smoothing:antialiased}
  .cover{position:relative;width:100%;height:100%;padding:2.6rem 2.6rem 2rem;display:flex;flex-direction:column;overflow:hidden}
  .head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:.7rem;font-size:.68rem;letter-spacing:.22em;color:var(--muted)}
  .head .mark{color:var(--accent);font-weight:700}
  .body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:1.4rem 0}
  .square{width:.72rem;height:.72rem;background:var(--accent);margin-bottom:1.2rem}
  .title{font-size:3.15rem;line-height:.1.12;line-height:1.12;font-weight:800;letter-spacing:-.02em;white-space:pre-line}
  .sub{margin-top:1.15rem;font-size:1rem;line-height:1.6;color:var(--muted);max-width:20rem}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line);padding-top:.75rem}
  .pageno{font-size:2.6rem;font-weight:200;line-height:1;color:var(--ink);opacity:.55}
  .swipe{font-size:.68rem;letter-spacing:.2em;color:var(--muted)}
  .aside{position:absolute;right:-3.2rem;top:38%;transform:rotate(90deg);font-size:.62rem;letter-spacing:.36em;color:var(--muted);opacity:.6}

  /* 变体 b：标题居中，竖排刊号换边 */
  .v-b .body{align-items:center;text-align:center}
  .v-b .square{margin-left:auto;margin-right:auto}
  .v-b .sub{margin-left:auto;margin-right:auto}
  .v-b .title{font-size:3.35rem;text-wrap:balance}
  .v-b .aside{right:auto;left:-3.2rem;top:30%;transform:rotate(-90deg)}
  .v-b .pageno{opacity:.85}
</style>
</head>
<body class="v-{{VARIANT}}">
  <div class="cover">
    <div class="head"><span class="mark">{{KICKER}}</span><span>RED NOTE / {{PAGE_LABEL}}</span></div>
    <div class="body">
      <div class="square"></div>
      <div class="title" id="title">{{TITLE}}</div>
      <div class="sub">{{SUBTITLE}}</div>
    </div>
    <div class="foot">
      <div class="pageno">01</div>
      <div class="swipe">{{SIGNATURE_BLOCK}}　SWIPE →</div>
    </div>
    <div class="aside">ISSUE</div>
  </div>
<script>
  (function fit() {
    const el = document.getElementById('title')
    if (!el) return
    let size = parseFloat(getComputedStyle(el).fontSize)
    let guard = 0
    while (el.getBoundingClientRect().height > {{HEIGHT}} * 0.42 && size > 20 && guard++ < 40) {
      size -= 1.5
      el.style.fontSize = size + 'px'
    }
  })()
</script>
</body>
</html>
